<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Back Form</title>
</head>
<body>
    <header>
        <h1>wright Your Feed Back</h1>
    </header>
    <main>
        <form action="" id="form">
            <div>
                <label for="email">Enter Your Email:</label>
                <input type="email" id="userEmail" name="email" placeholder="Enter Your Email" required>
            </div>
            <div>
                <label for="age">Enter Your Password</label>
                <input type="number" id="userAge" name="password" placeholder="Enter Your Age" minlength="18" maxlength="99" required>
            </div>
            <div>
                <textarea name="text" id="userText" maxlength="100"></textarea>
            </div>
        </form>
    </main>
    <script src="index.js"></script>
</body>
</html>
