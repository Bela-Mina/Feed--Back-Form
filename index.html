<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed Back Form</title>
</head>
<body>
    <header>
        <h1>wright Your Feed Back</h1>
    </header>
    <main>
        <form action="" id="form">
            <div>
                <label for="email">Enter Your Email:</label>
                <input type="email" id="userEmail" name="email" placeholder="Enter Your Email" required>
            </div>
            <div>
                <label for="age">Enter Your Age</label>
                <input type="number" id="userAge" name="age" placeholder="Enter Your Age" min="18" max="99" required>
            </div>
            <div>
                <textarea name="text" rows="8" cols="50" id="userText" required placeholder="type something..."></textarea>
                <p>Word: <span id="wordCount">0</span> / 100</p>
                <p>Characters: <span id="chartCount">0</span> / 5000</p>
            </div>
            <p id="error-text"></p>
            <button type="submit">Submit</button>
        </form>
    </main>
    <script src="index.js"></script>
</body>
</html>
